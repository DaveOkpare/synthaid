schema_version = "1"

[task]
id = "customer-support-returns"
version = "1"
steps = ["resolve"]

[seed]
path = "orders.csv"
id_variable = "case_id"

[variables]
case_id = "id"
days = "days"
opened = "opened"

[providers.default]
type = "openai"
api = "responses"
api_key_env = "OPENAI_API_KEY"

[model]
provider = "default"
name = "your-model"
max_tokens = 512

[runtime]
type = "local"

[environment]
type = "dialogue"
max_rounds = 4
timeout_seconds = 120.0

[agents.user]
target = false

[agents.user.reviewer]
type = "model"
max_revisions = 1

[agents.assistant]
target = true

[agents.assistant.reviewer]
type = "model"
max_revisions = 2

[verifier]
type = "model"
timeout_seconds = 60.0
