schema_version = "1"

[task]
id = "multi-tool"
version = "1"

[seed]
path = "seed.json"

[variables]
name = "name"

[providers.default]
type = "openai"

[model]
provider = "default"
name = "unused"

[runtime]
type = "local"

[environment]
type = "single"

[tools.summarize]
type = "function"
function = "multi_tool_components:summarize"
description = "Summarize a label in uppercase."

[tools.summarize.input_schema]
type = "object"
properties = { text = { type = "string" } }
required = ["text"]
additionalProperties = false

[agents.assistant]
type = "multi_tool_components:LabelAgent"
target = true
tools = ["summarize"]

[agents.assistant.reviewer]
type = "deterministic"
max_revisions = 0

[agents.assistant.reviewer.checks]
nonempty = "nonempty_content"
