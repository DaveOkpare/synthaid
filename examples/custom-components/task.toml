schema_version = "1"
[task]
id = "custom-dialogue"
version = "1"
[seed]
path = "seed.json"
[providers.default]
type = "openai"
[model]
provider = "default"
name = "unused"
[runtime]
type = "local"
[environment]
type = "dialogue"
[agents.user]
type = "model"
target = false
[agents.assistant]
type = "model"
target = true
tools = ["lookup"]
[agents.assistant.reviewer]
type = "round_table_components:review"
[tools.lookup]
type = "function"
function = "round_table_components:lookup"
description = "Return a safe label"
[tools.lookup.input_schema]
type = "object"
properties = {label = {type = "string"}}
required = ["label"]
additionalProperties = false
[verifier]
type = "round_table_components:verify"
