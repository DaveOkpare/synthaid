schema_version = "1"
[task]
id = "structured-quality"
version = "1"
[seed]
path = "seed.json"
[variables]
name = "name"
[providers.judge]
type = "openai-compatible"
api = "chat_completions"
base_url = "https://example.invalid/v1"
[model]
provider = "judge"
name = "example-judge"
temperature = 0.0
[agents.assistant]
target = true
type = "scripted"
responses = [{ content = "Hello Ada.", control = "complete" }]
[agents.assistant.reviewer]
type = "model"
max_revisions = 1
[verifier]
type = "model"
timeout_seconds = 30.0
[environment]
type = "single"
[runtime]
type = "local"
