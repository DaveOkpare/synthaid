schema_version = "1"

[task]
id = "provider-greeting"
version = "1"

[seed]
path = "seed.json"

[variables]
name = "name"

[providers.default]
type = "openai"
api = "chat_completions"
api_key_env = "OPENAI_API_KEY"

[model]
provider = "default"
# Replace with a Chat Completions model available to your account.
name = "your-chat-model"
max_tokens = 128

[runtime]
type = "local"

[environment]
type = "single"

[agents.assistant]
target = true
