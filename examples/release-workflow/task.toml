schema_version = "1"
[task]
id = "release-dialogue"
version = "1"
steps = ["collect", "conclude"]
[seed]
path = "seeds.jsonl"
id_variable = "case_id"
[variables]
case_id = "id"
name = "name"
outcome = "outcome"
[providers.default]
type = "openai"
[model]
provider = "default"
name = "unused-offline-model"
[runtime]
type = "local"
[environment]
type = "dialogue"
max_turns = 6
[agents.user]
type = "model"
target = false
[agents.assistant]
type = "model"
target = true
tools = ["lookup"]
[agents.user.reviewer]
type = "release_components:review"
max_revisions = 1
[agents.assistant.reviewer]
type = "release_components:review"
max_revisions = 1
[tools.lookup]
type = "function"
function = "release_components:lookup"
description = "Return a reviewed label and this Trace's invocation count."
[tools.lookup.input_schema]
type = "object"
properties = { label = { type = "string" }, seed = { type = "string" } }
required = ["label", "seed"]
additionalProperties = false
[verifier]
type = "release_components:verify"
