schema_version = "1"

[task]
id = "reviewed-greeting"
version = "1"

[seed]
path = "seed.json"

[variables]
name = "name"

[providers.default]
type = "openai"

[model]
provider = "default"
name = "unused-model"

[runtime]
type = "local"

[environment]
type = "dialogue"
max_turns = 2

[agents.user]
target = false
type = "model"

[agents.user.reviewer]
type = "model"
max_revisions = 1

[agents.assistant]
target = true
type = "model"

[verifier]
type = "model"
