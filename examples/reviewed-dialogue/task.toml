schema_version = "1"

[task]
id = "reviewed-greeting"
version = "1"

[seed]
path = "seed.json"

[variables]
name = "name"

# Scripted Agents and deterministic quality checks make no Provider calls.
[providers.default]
type = "openai"

[model]
provider = "default"
name = "unused-model"

[runtime]
type = "local"

[environment]
type = "dialogue"
max_turns = 2

[agents.user]
target = false
type = "model"

[agents.user.reviewer]
type = "deterministic"
max_revisions = 1

[agents.user.reviewer.checks]
nonempty = "nonempty_content"

[agents.assistant]
target = true
type = "model"

[verifier]
type = "deterministic"

[verifier.checks]
assistant_reply = "assistant_present"
