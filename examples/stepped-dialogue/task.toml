schema_version = "1"

[task]
id = "stepped-dialogue"
version = "1"
steps = ["collect", "conclude"]

[seed]
path = "seed.json"

[variables]
name = "name"

[providers.default]
type = "openai"

[model]
provider = "default"
name = "unused-offline-example"

[runtime]
type = "local"

[environment]
type = "dialogue"
max_turns = 8

[agents.user]
type = "model"
target = false

[agents.assistant]
type = "model"
target = true
tools = ["lookup"]

[agents.assistant.reviewer]
type = "deterministic"
max_revisions = 0
checks = { nonempty = "nonempty_content", collect_explanation = "nonempty_content", conclude_explanation = "nonempty_content" }

[tools.lookup]
type = "function"
function = "stepped_components:lookup"
description = "Return the Seed's greeting privately."
input_schema = { type = "object", properties = { name = { type = "string" } }, required = ["name"], additionalProperties = false }
