schema_version = "1"

[task]
id = "doubleword-medagent-smoke"
version = "1"

[seed]
path = "seeds.jsonl"
id_variable = "case_id"

[variables]
case_id = "id"
topic = "scenario.topic"
discussion_type = "scenario.discussion_type"
language = "scenario.language"

[providers.doubleword]
type = "openai-compatible"
api = "chat_completions"
base_url = "https://api.doubleword.ai/v1"
api_key_env = "DOUBLEWORD_API_KEY"

[model]
provider = "doubleword"
name = "Qwen/Qwen3.6-35B-A3B-FP8"

[runtime]
type = "local"

[environment]
type = "dialogue"
max_rounds = 2
timeout_seconds = 120.0

[agents.user]
target = false

[agents.assistant]
target = true
tools = ["read_scenario"]

[tools.read_scenario]
type = "smoke_components:read_scenario"
description = "Read the non-personal synthetic scenario brief for this test. Read once before answering the first user question."
input_schema = { type = "object", properties = {}, additionalProperties = false }
output_schema = { type = "object", properties = { topic = { type = "string" }, discussion_type = { type = "string" }, language = { type = "string" } }, required = ["topic", "discussion_type", "language"], additionalProperties = false }

[verifier]
type = "model"
timeout_seconds = 60.0
