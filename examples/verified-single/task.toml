schema_version = "1"

[task]
id = "verified-greeting"
version = "1"

[seed]
path = "seed.json"

[variables]
name = "name"

# The scripted Agent and deterministic Verifier do not call this Provider.
[providers.default]
type = "openai"

[model]
provider = "default"
name = "unused-model"

[runtime]
type = "local"

[environment]
type = "single"

[agents.assistant]
target = true
type = "scripted"
responses = ["Hello, Ada."]

[verifier]
type = "deterministic"
timeout_seconds = 10.0

[verifier.checks]
has_reply = "nonempty_conversation"
completed = "generation_terminated"
