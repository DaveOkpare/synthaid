schema_version = "1"

[task]
id = "function-tool"
version = "1"

[seed]
path = "seed.json"

[variables]
name = "name"

[providers.default]
type = "openai"

[model]
provider = "default"
name = "unused"

[runtime]
type = "local"

[environment]
type = "single"

[tools.uppercase]
type = "function"
function = "function_tool_components:uppercase"
description = "Return the supplied text in uppercase."

[tools.uppercase.input_schema]
type = "object"
properties = { text = { type = "string" } }
required = ["text"]
additionalProperties = false

[agents.assistant]
type = "function_tool_components:GreetingAgent"
target = true
tools = ["uppercase"]

[agents.assistant.reviewer]
type = "deterministic"
max_revisions = 0

[agents.assistant.reviewer.checks]
nonempty = "nonempty_content"
