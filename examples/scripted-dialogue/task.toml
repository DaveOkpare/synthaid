schema_version = "1"

[task]
id = "scripted-dialogue"
version = "1"

[seed]
path = "seed.json"

[variables]
topic = "topic"

[providers.default]
type = "openai"

[model]
provider = "default"
name = "unused-model"

[runtime]
type = "local"

[environment]
type = "dialogue"
max_turns = 6

[agents.user]
target = false
type = "model"

[agents.assistant]
target = true
type = "model"
