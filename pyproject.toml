[project]
name = "synthaid"
version = "0.1.0"
description = "A framework for generating verified traces from agent interactions"
readme = "README.md"
authors = [
    { name = "daveokpare", email = "okparedave@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=2.30,<3",
    "pydantic>=2.12,<3",
]

[project.scripts]
synthaid = "synthaid.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 80
extend-exclude = ["plan.md"]

# Follows the Google Python Style Guide:
# https://google.github.io/styleguide/pyguide.html
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]
# The guide annotates type aliases with TypeAlias instead of `type X = ...`.
ignore = ["UP040"]

[tool.ruff.lint.per-file-ignores]
# The guide only wants test docstrings that add information.
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
single-line-exclusions = ["collections.abc", "typing"]
force-sort-within-sections = true
known-first-party = ["synthaid", "tests"]
order-by-type = false
case-sensitive = false

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
