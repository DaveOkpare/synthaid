[project]
name = "agentinstruct"
version = "0.1.0"
description = "A framework for generating verified traces from agent interactions"
readme = "README.md"
authors = [
    { name = "daveokpare", email = "okparedave@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<1",
    "jinja2>=3.1.6,<4",
    "jsonschema>=4.23,<5",
    "pydantic>=2.12,<3",
    "referencing>=0.36,<1",
]

[project.scripts]
agentinstruct = "agentinstruct.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
# Preserve historical design examples and quoted upstream code in research notes.
exclude = ["research/*.md"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
